# Short description of this project
description: |-
  Terraform provider that defines your naming convention once and applies it everywhere — consistent resource names
  and tags across every module, without passing context maps around.

introduction: |-
  Naming things is one of the hardest problems in infrastructure. Without a programmatic naming convention,
  inconsistencies creep in across environments, teams, and modules. Resource names drift, tags are forgotten or
  misformatted, and what should be a simple convention becomes a source of constant cognitive load.

  The best way to solve this is by defining a naming convention once and enforcing it everywhere. Cloud Posse proved
  this approach works with [terraform-null-label](https://github.com/cloudposse/terraform-null-label), which has been
  adopted in hundreds of modules. But `terraform-null-label` is opinionated about which properties make up a label
  (namespace, tenant, stage, environment, name), and passing the context between modules requires copying a
  [context.tf](https://github.com/cloudposse/terraform-null-label/blob/main/exports/context.tf) file into every module
  and threading a context map through every module call.

  This provider eliminates all of that. A Terraform provider has a persistent context that is automatically available
  to every module and sub-module within a root module — no passing variables, no copying files, no boilerplate.
  You configure the naming convention once in the provider block, and every `context_label` or `context_tags` data
  source anywhere in your configuration just works.

  Unlike `terraform-null-label`, this provider lets you define your own property names and validation rules, so you
  are not locked into a fixed schema. Use whatever properties make sense for your organization — `product`, `region`,
  `cost_center`, `team` — and the provider handles label generation, tag formatting, and value validation for you.

  ### Data Sources

  The provider includes three data sources:

  - **`context_label`** — Generates a label string from context values. Supports two modes:
    - **Delimited**: Joins property values with a delimiter (e.g. `acme-core-prod-uw2-example`)
    - **Templated**: Uses a Go template string (e.g. `{{.namespace}}/{{.tenant}}/{{.stage}}/{{.name}}`)
  - **`context_tags`** — Generates a map of tags from context values, with configurable case transformations for keys and values.
  - **`context_config`** — Reads the current provider configuration, useful for passing context to child modules.

# How to use this module. Should be an easy example to copy and paste.
usage: |-
  Here is how to use this provider in your own Terraform code:

  ```hcl
  terraform {
    required_providers {
      context = {
        source  = "cloudposse/context"
        version = ">= 0.4.0"
      }
    }
  }

  provider "context" {
    delimiter = "-"
    enabled   = true

    properties = {
      namespace   = { required = true }
      tenant      = {}
      stage       = {}
      environment = {}
      name        = { required = true }
    }

    property_order = ["namespace", "tenant", "stage", "environment", "name"]

    tags_key_case   = "title"
    tags_value_case = "none"

    values = {
      namespace   = "acme"
      tenant      = "core"
      stage       = "prod"
      environment = "uw2"
      name        = "example"
    }
  }

  # Generate a delimited label: "acme-core-prod-uw2-example"
  data "context_label" "delimited" {
  }

  # Generate a templated label: "acme/core/prod/example"
  data "context_label" "templated" {
    template = "{{.namespace}}/{{.tenant}}/{{.stage}}/{{.name}}"
  }

  # Generate tags from context values
  data "context_tags" "this" {
  }

  # Read the provider configuration
  data "context_config" "this" {
  }
  ```

  ### Using with Atmos

  The context provider becomes incredibly powerful when combined with [Atmos](https://atmos.tools). Atmos uses
  **imports and inheritance** to let you define your naming convention once at the organizational level, then
  automatically override just the values that change per region, environment, or component — without repeating
  any configuration.

  Atmos generates a `providers_override.tf.json` file for each component, so your Terraform code never needs to
  know how it was configured. Your components just declare an empty `provider "context" {}` block and everything
  works.

  See the complete [demo-context](https://github.com/cloudposse/atmos/tree/main/examples/demo-context) example for a
  full working setup.

  #### 1. Define your naming convention once

  Set the provider properties, validation rules, and organizational defaults in a single `_defaults.yaml`. Every
  stack that imports this file inherits the full configuration.

  ```yaml
  # stacks/deploy/_defaults.yaml
  terraform:
    providers:
      context:
        enabled: true
        delimiter: "-"
        property_order:
          - product
          - region
          - environment
          - name
          - instance
        properties:
          product:
            required: true
          region:
            required: true
            validation_regex: "^(east|west)$"
          environment:
            required: true
            max_length: 7
          name:
            required: true
          instance: {}
        tags_key_case: title
        values:
          product: "acme"
          component: "{{.atmos_component}}"
          stack: "{{.atmos_stack}}"
  ```

  #### 2. Use imports and inheritance to override per environment

  Each environment stack imports the defaults and only specifies what changes. Atmos deep-merges the provider
  configuration, so you never repeat the properties, validation rules, or organizational values.

  ```yaml
  # stacks/mixins/regions/us-west.yaml
  terraform:
    providers:
      context:
        values:
          region: west
  ```

  ```yaml
  # stacks/deploy/dev/myapp.yaml
  import:
    - ../_defaults
    - catalog/myapp
    - mixins/regions/us-west

  terraform:
    providers:
      context:
        values:
          environment: dev
          support_email: dev-support@acme.com
  ```

  The result is a fully assembled provider configuration — the naming convention from `_defaults.yaml`, the region
  from the mixin, and the environment from the stack file — all deep-merged automatically.

  #### 3. Components stay clean

  Your Terraform components declare an empty provider block. Atmos generates the `providers_override.tf.json` with
  the fully resolved configuration.

  ```hcl
  # components/terraform/mycomponent/providers.tf
  provider "context" {}
  ```

  #### 4. Use context values for stack naming

  Atmos can even use the context provider values to derive stack names, so naming is consistent across both your
  infrastructure and your Atmos configuration.

  ```yaml
  # atmos.yaml
  stacks:
    name_template: "{{.providers.context.values.product}}-{{.providers.context.values.region}}-{{.providers.context.values.environment}}"
  ```

  See the [Docs](./docs) for additional information.

